name: Cache Patdi heritage photos locally
on:
  push:
    paths:
      - '.github/workflows/local-heritage-images.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  optimize-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download and optimize Wikimedia images
        run: |
          python -m pip install --quiet pillow requests
          python - <<'PY'
          from pathlib import Path
          from io import BytesIO
          import requests
          from PIL import Image
          images = {
            'patdi-talao.webp': 'Temple_near_Shakti_Mata_temple_at_the_bank_of_Patdi_Talao_DSCN3867_1.jpg',
            'patdi-temple.webp': 'Patdi_Temple.jpg'
          }
          out = Path('public/images')
          out.mkdir(parents=True, exist_ok=True)
          for target, source in images.items():
              url = 'https://commons.wikimedia.org/wiki/Special:FilePath/' + source + '?width=960'
              response = requests.get(url, headers={'User-Agent':'Patdi360Demo/1.0 (heritage photo optimization)'}, timeout=50)
              response.raise_for_status()
              im = Image.open(BytesIO(response.content)).convert('RGB')
              im.thumbnail((960,960))
              im.save(out/target, 'WEBP', quality=76, method=6)
              print(target, (out/target).stat().st_size)
          PY
      - name: Switch site to locally hosted images
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('public/app.js')
          s=p.read_text()
          import re
          s=re.sub(r'https://commons.wikimedia.org/wiki/Special:FilePath/Temple_near_Shakti_Mata_temple_at_the_bank_of_Patdi_Talao_DSCN3867_1.jpg\\?width=\\d+', '/images/patdi-talao.webp',s)
          s=re.sub(r'https://commons.wikimedia.org/wiki/Special:FilePath/Patdi_Temple.jpg\\?width=\\d+', '/images/patdi-temple.webp',s)
          p.write_text(s)
          p=Path('public/style.css')
          s=p.read_text()
          s=re.sub(r'https://commons.wikimedia.org/wiki/Special:FilePath/Temple_near_Shakti_Mata_temple_at_the_bank_of_Patdi_Talao_DSCN3867_1.jpg\\?width=\\d+', '/images/patdi-talao.webp',s)
          s=re.sub(r'https://commons.wikimedia.org/wiki/Special:FilePath/Patdi_Temple.jpg\\?width=\\d+', '/images/patdi-temple.webp',s)
          p.write_text(s)
          p=Path('public/index.html')
          s=p.read_text()
          s=s.replace('20261018-heritage-v2','20261018-local-images-v3')
          p.write_text(s)
          PY
      - name: Commit optimized images and local URLs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images public/app.js public/style.css public/index.html
          git diff --cached --quiet || (git commit -m "Host optimized Patdi heritage photos as local WebP assets" && git push)
